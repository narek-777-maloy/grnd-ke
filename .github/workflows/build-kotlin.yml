name: Build AdminKeyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AdminKeyboard-Kotlin.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Kotlin project
        run: |
          unzip -q AdminKeyboard-Kotlin.zip -d extracted
          test -f extracted/AdminKeyboard/app/build.gradle

      - name: Build debug APK
        run: gradle -p extracted/AdminKeyboard :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdminKeyboard-debug-apk
          path: extracted/AdminKeyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
